<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viziona · Le studio visuel de votre club</title>
    <meta name="description" content="Créez les visuels de votre club en 30 secondes : compositions, résultats, convocations, annonces. Football, rugby, hockey, basket, handball, natation, triathlon." />

    <!-- Onglet du navigateur. Le SVG s'adapte au thème clair ou sombre ;
         le PNG sert de repli aux navigateurs qui ne gèrent pas le SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />

    <!-- iOS n'accepte pas le SVG ici et n'applique aucune transparence :
         PNG carré, logo blanc sur fond noir. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Polices declarees ici plutot qu injectees par JavaScript : le
         navigateur lance la requete des l analyse du HTML, sans attendre le
         telechargement puis l execution du bundle. Le preconnect ouvre la
         connexion a gstatic en parallele, ce qui evite un aller-retour DNS +
         TLS au moment ou la feuille de style arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- L identifiant est celui que testent les gardes de Landing, Auth et App :
         en le posant ici, leurs injections a l execution deviennent inertes
         sans avoir a toucher leur code. Le jeu de graisses est l union des
         trois, italiques comprises. -->
    <link id="viziona-landing-fonts" rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=DM+Mono:wght@400;500&display=swap">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Viziona">

    <!-- Aperçu au partage (WhatsApp, Slack, réseaux sociaux). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Viziona · Le studio visuel de votre club" />
    <meta property="og:description" content="Du terrain au feed, en 30 secondes. Les visuels de votre club, à vos couleurs." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
